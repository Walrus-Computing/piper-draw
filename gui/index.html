<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piper Draw</title>
    <!-- umami tracker, proxied first-party by the backend (see server.py) so
         hostname blocklists don't drop it. data-host-url="/" makes the script
         post to same-origin /api/send (its default is gateway.umami.is, which
         is blocklisted like cloud.umami.is); the backend forwards from there. -->
    <script defer src="/pd.js" data-host-url="/" data-website-id="%VITE_UMAMI_WEBSITE_ID%"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
